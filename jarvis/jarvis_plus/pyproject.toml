[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-plus"
version = "0.1.0"
description = "Persönliche Erweiterungen für OpenJarvis: Whoop, Garmin, Stress-Check, Anrufe, Instagram, Kunden."
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.6",
]

[project.optional-dependencies]
# Garmin hat keine offizielle Consumer-API; wir nutzen die inoffizielle
# Bibliothek garminconnect (Login mit deinem Garmin-Account).
garmin = ["garminconnect>=0.2.19"]
dev = ["pytest>=8"]

[project.scripts]
jarvis-plus = "jarvis_plus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
