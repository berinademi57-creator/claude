# ═══════════════════════════════════════════════════════════════
#  Dein persönlicher Jarvis – OpenJarvis-Konfiguration
#  Wird vom Installer nach ~/.openjarvis/config.toml kopiert.
#  API-Keys gehören NICHT hierher, sondern in ~/.openjarvis/credentials.toml
# ═══════════════════════════════════════════════════════════════

# ─── Gehirn ─────────────────────────────────────────────────────
# Variante A (Standard): Claude über die Anthropic-API.
#   Haiku = sehr schnell und günstig für den Alltag (Telegram, Fragen, Erinnerungen).
#   Das HUD schaltet bei Websites/Code/Strategie automatisch auf Sonnet
#   (JARVIS_MODEL_FAST / JARVIS_MODEL_SMART in jarvis-plus.env).
#   Prompt-Caching ist bei Claude automatisch aktiv, das spart zusätzlich Kosten.
[engine]
default = "cloud"

[intelligence]
default_model = "claude-haiku-5-5"
provider = "anthropic"
temperature = 0.6
max_tokens = 8192   # genug Platz für eine komplette Website in einer Antwort

# Variante B: komplett lokal und kostenlos (braucht einen starken PC).
# Dafür die vier Zeilen oben auskommentieren und diese aktivieren:
# [engine]
# default = "ollama"
# [intelligence]
# default_model = "qwen3.5:9b"

# ─── Agent (wie Jarvis denkt und welche Werkzeuge er hat) ────────
[agent]
default_agent = "orchestrator"
max_turns = 12
context_from_memory = true
# Eingebaute Werkzeuge. Die jarvis-plus-Werkzeuge (Gesundheit, Anrufe, Instagram,
# Kunden, Websites, Design, Apps/Links öffnen) und die Connectoren (Browser mit
# deinen Logins, Desktop-Steuerung, Higgsfield …) kommen automatisch über MCP dazu.
#
# VOLLER PC-ZUGRIFF: shell_exec, file_*, apply_patch und code_interpreter laufen
# als dein Benutzer, ohne Einschränkung. Jarvis fragt laut SOUL.md vor allem,
# was löscht, installiert, bezahlt oder etwas an andere schickt.
# Weniger Zugriff? Einfach die Namen aus der Liste entfernen.
tools = "think,calculator,web_search,get_weather,user_profile_manage,memory_manage,knowledge_search,schedule_task,list_scheduled_tasks,pause_scheduled_task,resume_scheduled_task,cancel_scheduled_task,calendar_upcoming,calendar_search,channel_send,pdf_extract,file_read,file_write,shell_exec,apply_patch,code_interpreter,git_status,git_diff,git_commit,git_log,http_request"

# Persönlichkeit + Infos über dich liegen in:
#   ~/.openjarvis/SOUL.md    (wer Jarvis ist: Coach + Business-Partner)
#   ~/.openjarvis/USER.md    (Kurzprofil über dich)
#   ~/.openjarvis/MEMORY.md  (dein Business-Wissen, z.B. ademidigital)
#   ~/.openjarvis/skills/    (Website-Skills, Marken-Skill …)
[system_prompt]
soul_max_chars = 8000
user_max_chars = 3000
memory_max_chars = 4000

# Langzeitgedächtnis: Jarvis merkt sich automatisch Fakten aus Gesprächen.
# Ansehen/Löschen: `jarvis memory list` / `jarvis memory clear`
[memory]
enabled = true
backend = "local"
max_facts = 5000

[tools.storage]
default_backend = "sqlite"

# ─── Erweiterungen (jarvis-plus + weitere MCP-Server) ───────────
[tools.mcp]
enabled = true
servers = "mcp-servers.json"

# ─── Server (API für HUD, Desktop-App, Telegram) ────────────────
# Das HUD (jarvis-plus hud, Port 8765) spricht mit diesem Server.
[server]
host = "127.0.0.1"
port = 8000
agent = "orchestrator"

# ─── Überall erreichbar: Telegram (Handy, PC, Tablet, Uhr) ──────
# Bot-Token kommt aus credentials.toml (TELEGRAM_BOT_TOKEN).
# allowed_chat_ids: NUR deine Chat-ID, damit niemand sonst deinen Jarvis nutzt.
[channel]
enabled = true
default_channel = "telegram"
default_agent = "orchestrator"

[channel.telegram]
allowed_chat_ids = ""   # ← vom Installer/von dir eingetragen, z.B. "123456789"
parse_mode = "Markdown"

# ─── Stimme (Sprachausgabe/-eingabe am PC) ──────────────────────
[speech]
backend = "auto"
language = "de"
# Im HUD läuft Sprache kostenlos über den Browser (Chrome/Edge/Safari).
# Diese Einstellungen gelten für `jarvis` im Terminal / die Desktop-App.
tts_backend = "openai_tts"   # klingt natürlich auf Deutsch; braucht OPENAI_API_KEY
voice_id = "onyx"
voice_speed = 1.05

# ─── Proaktiv: Jarvis meldet sich selbst ────────────────────────
[proactive]
enabled = true
schedule = "0 7 * * *"
timezone = "Europe/Zurich"
notification_channel = ""   # ← z.B. "telegram:123456789"

[telemetry]
enabled = false

[traces]
enabled = false
